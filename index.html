<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-EPT 第四級自學複習站</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f8fd;--card:#ffffff;--ink:#23303f;--mute:#6a7a8c;--line:#dce8f3;
  --pri:#2f6fe0;--pri-ink:#ffffff;--ok:#1f7a52;--okbg:#e6f6ee;--bad:#b8412f;--badbg:#fdeeea;--warn:#8a6414;--warnbg:#fff7dc;
  --shadow:0 1px 4px rgba(60,100,150,.10);
}
*{box-sizing:border-box}
body{margin:0;min-width:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.bar{max-width:880px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:18px;margin:0 0 6px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:8px;font:inherit;font-size:15px;cursor:pointer}
nav button.on{background:var(--pri);color:var(--pri-ink)}
main{max-width:880px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:14px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:13px}
button.b,select,input[type=text]{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button.b:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
button.no{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
label{color:var(--mute);font-size:14px}
.mute{color:var(--mute)}.small{font-size:13px}
.flash{min-height:230px;text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.flash .w{font-size:34px;font-weight:700}
.flash .m{font-size:20px}
.flash .ex{text-align:left;width:100%;margin-top:8px;font-size:15px}
.flash .ex div{margin-bottom:6px}
.pos{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mute);margin-right:6px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.sel{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.passage{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:10px;font-size:15px;white-space:pre-line}
.expl{background:var(--warnbg);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.expl .tag{color:var(--warn);font-weight:700}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}.prog i{display:block;height:100%;background:var(--pri)}
.q{margin:0 0 6px;font-weight:600}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
a{color:var(--pri)}
ul{padding-left:20px;margin:6px 0}
input[type=text]{width:100%;font-size:20px}
.good{color:var(--ok)}.bad{color:var(--bad)}
.hidden{display:none}
</style>
</head>
<body>
<header><div class="bar">
  <h1>C-EPT 英語能力測驗・第四級 自學複習站</h1>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<script src="data.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const store={
  get(k,d){try{const v=localStorage.getItem('cept4:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('cept4:'+k,JSON.stringify(v))}catch(e){}}
};
const V=window.VOCAB, E=window.EXAMS;
const vkey=w=>w.w+'|'+w.d[0][0];
let prog=store.get('vocab',{});       // key -> {box, seen, wrong}
let wrongQ=store.get('wrongQ',{});    // "s-n" -> true
let hist=store.get('hist',[]);        // exam history
const saveProg=()=>store.set('vocab',prog), saveWrong=()=>store.set('wrongQ',wrongQ), saveHist=()=>store.set('hist',hist);
const P=w=>prog[vkey(w)]||(prog[vkey(w)]={box:0,seen:0,wrong:0});
function ask(msg,yes){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px';d.innerHTML='<div class="card" style="max-width:360px;margin:0"><p style="margin:0 0 12px">'+esc(msg)+'</p><div class="row"><button class="b pri" id="ay">確定</button><button class="b" id="an">取消</button></div></div>';document.body.appendChild(d);d.querySelector('#an').onclick=()=>d.remove();d.querySelector('#ay').onclick=()=>{d.remove();yes()}}
function note(msg){const d=document.createElement('div');d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const clean=w=>w.w.replace(/\(.*?\)/g,'').split('/')[0].trim();
const letters=[...new Set(V.map(w=>w.w[0].toUpperCase()))].sort();
const defText=w=>w.d.map(d=>d[1]).join('；');
const SECTIONS=[['all','全部 21–60',21,60],['arr','重組 21–25',21,25],['voc','詞彙與結構 26–40',26,40],['clz','綜合測驗 41–50',41,50],['rd','閱讀測驗 51–60',51,60]];

/* ---------- router ---------- */
const TABS=[['home','總覽'],['cards','單字卡'],['quiz','單字測驗'],['exam','歷屆題'],['wrong','錯題本'],['guide','考試資源']];
let tab=location.hash.slice(1)||'home';
function go(t){tab=t;location.hash=t;render()}
function render(){
  $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?'on':''}" data-t="${k}">${n}${k==='wrong'&&Object.keys(wrongQ).length?` (${Object.keys(wrongQ).length})`:''}</button>`).join('');
  $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t)go(t)};
  ({home,cards,quiz,exam,wrong,guide}[tab]||home)();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(t&&t!==tab){tab=t;render()}});

/* ---------- home ---------- */
function home(){
  const mastered=V.filter(w=>(prog[vkey(w)]||{}).box>=3).length;
  const seen=V.filter(w=>(prog[vkey(w)]||{}).seen>0).length;
  const last=hist.slice(-5).reverse();
  const acc=hist.length?Math.round(hist.reduce((a,h)=>a+h.right,0)/hist.reduce((a,h)=>a+h.total,0)*100):null;
  $('#app').innerHTML=`
  <div class="card"><h2>你的進度</h2>
   <div class="grid">
    <div class="stat"><b>${seen}/${V.length}</b><span>已看過的單字</span></div>
    <div class="stat"><b>${mastered}</b><span>已熟悉（Box 3+）</span></div>
    <div class="stat"><b>${hist.length}</b><span>完成的歷屆練習</span></div>
    <div class="stat"><b>${acc===null?'—':acc+'%'}</b><span>歷屆題累計正確率</span></div>
    <div class="stat"><b>${Object.keys(wrongQ).length}</b><span>錯題本</span></div>
   </div>
   <div class="prog"><i style="width:${Math.round(mastered/V.length*100)}%"></i></div>
   <div class="small mute">單字取自學會公告的「四級單字（113 年版）」共 ${V.length} 個詞條；歷屆題為第 27–31 屆第四級試題的非聽力部分（第 21–60 題）。</div>
  </div>
  <div class="card"><h2>建議的複習流程</h2><ol>
    <li><b>單字卡</b>：每天 30–50 個，會的按「我會」，不會的按「再看」，系統用盒子制自動安排複習。</li>
    <li><b>單字測驗</b>：用選擇題、拼字、例句填空檢驗記憶。</li>
    <li><b>歷屆題</b>：先做「詞彙與結構」，再練「重組」「綜合」「閱讀」，最後做整回模擬。</li>
    <li><b>錯題本</b>：集中重做錯過的題目，答對才會移出。</li>
    <li><b>聽力</b>需要音檔與圖片，請到官網下載（見「考試資源」）。</li></ol>
   <div class="row"><button class="b pri" data-go="cards">開始背單字</button><button class="b" data-go="exam">做歷屆題</button></div></div>
  <div class="card"><h2>最近的練習</h2>${last.length?last.map(h=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>${esc(h.title)}</span><span><b>${h.right}/${h.total}</b> <span class="mute small">${new Date(h.at).toLocaleDateString('zh-TW')}</span></span></div>`).join(''):'<span class="mute">還沒有紀錄。</span>'}
   <div style="margin-top:12px"><button class="b small" id="reset">清除所有進度</button></div></div>`;
  $('#app').onclick=e=>{const g=e.target.dataset.go;if(g)go(g);if(e.target.id==='reset')ask('確定清除所有學習紀錄？',()=>{prog={};wrongQ={};hist=[];saveProg();saveWrong();saveHist();render()})};
}

/* ---------- flashcards ---------- */
let fc={letter:'all',mode:'due',deck:[],i:0,open:false};
function buildDeck(){
  let d=V.filter(w=>fc.letter==='all'||w.w[0].toUpperCase()===fc.letter);
  if(fc.mode==='due')d=d.filter(w=>P(w).box<3);
  else if(fc.mode==='hard')d=d.filter(w=>P(w).wrong>0&&P(w).box<4);
  d.sort((a,b)=>P(a).box-P(b).box||Math.random()-.5);
  fc.deck=d.slice(0,fc.mode==='all'?d.length:60);fc.i=0;fc.open=false;
}
function cards(){
  if(!fc.deck.length&&!fc.started){buildDeck();fc.started=true}
  $('#app').innerHTML=`
  <div class="card"><div class="row">
    <label>字母 <select id="fl"><option value="all">全部</option>${letters.map(l=>`<option ${l===fc.letter?'selected':''}>${l}</option>`).join('')}</select></label>
    <label>範圍 <select id="fm">
      <option value="due" ${fc.mode==='due'?'selected':''}>尚未熟悉（每次 60 張）</option>
      <option value="hard" ${fc.mode==='hard'?'selected':''}>曾答錯</option>
      <option value="all" ${fc.mode==='all'?'selected':''}>全部依序</option></select></label>
    <button class="b" id="fb">重新洗牌</button></div></div>
  <div id="fcard"></div>`;
  $('#fl').onchange=e=>{fc.letter=e.target.value;buildDeck();drawCard()};
  $('#fm').onchange=e=>{fc.mode=e.target.value;buildDeck();drawCard()};
  $('#fb').onclick=()=>{buildDeck();if(fc.mode==='all')fc.deck=shuffle(fc.deck);drawCard()};
  drawCard();
}
function drawCard(){
  const box=$('#fcard');if(!box)return;
  if(!fc.deck.length){box.innerHTML='<div class="card">這個範圍沒有單字了，換一個條件看看。</div>';return}
  if(fc.i>=fc.deck.length){box.innerHTML=`<div class="card"><h2>這一輪完成 🎉</h2><p>共 ${fc.deck.length} 張。</p><button class="b pri" id="again">再來一輪</button></div>`;$('#again').onclick=()=>{buildDeck();drawCard()};return}
  const w=fc.deck[fc.i],p=P(w);
  const back=fc.open?`<div class="m">${w.d.map(d=>`<span class="pos">${esc(d[0])}</span>${esc(d[1])}`).join('<br>')}</div>
    ${w.n?`<div class="small mute">${esc(w.n)}</div>`:''}
    <div class="ex">${w.e.map(x=>`<div>${esc(x[0])}<br><span class="mute">${esc(x[1])}</span></div>`).join('')}</div>`:'<div class="mute small">點卡片翻面（空白鍵）</div>';
  box.innerHTML=`
  <div class="mute small">${fc.i+1} / ${fc.deck.length} <span class="badge">Box ${p.box}</span></div>
  <div class="prog"><i style="width:${fc.i/fc.deck.length*100}%"></i></div>
  <div class="card flash" id="fk"><div class="w">${esc(w.w)} <button class="b small" id="sp" title="發音">🔊</button></div>${back}</div>
  <div class="row" style="justify-content:center"><button class="b no" id="bad">再看（←）</button><button class="b ok" id="good">我會（→）</button></div>`;
  $('#fk').onclick=e=>{if(e.target.id==='sp'){speak(clean(w));return}fc.open=!fc.open;drawCard()};
  $('#bad').onclick=()=>rate(false);$('#good').onclick=()=>rate(true);
}
function rate(ok){
  const w=fc.deck[fc.i],p=P(w);p.seen++;
  if(ok)p.box=Math.min(4,p.box+1);else{p.box=0;p.wrong++}
  saveProg();fc.i++;fc.open=false;drawCard();
}
document.addEventListener('keydown',e=>{
  if(tab!=='cards'||e.target.tagName==='SELECT'||fc.i>=fc.deck.length)return;
  if(e.key===' '){e.preventDefault();fc.open=!fc.open;drawCard()}
  else if(e.key==='ArrowRight')rate(true);else if(e.key==='ArrowLeft')rate(false);
});

/* ---------- vocab quiz ---------- */
let qz=null;
function quiz(){
  if(qz&&qz.running)return drawQuiz();
  $('#app').innerHTML=`<div class="card"><h2>單字測驗</h2>
  <div class="row">
   <label>題型 <select id="qt"><option value="en2zh">英文 → 中文</option><option value="zh2en">中文 → 英文</option><option value="cloze">例句填空</option><option value="spell">看中文拼字</option><option value="mix">混合</option></select></label>
   <label>字母 <select id="ql"><option value="all">全部</option>${letters.map(l=>`<option>${l}</option>`).join('')}</select></label>
   <label>題數 <select id="qn"><option>10</option><option selected>20</option><option>40</option></select></label>
   <label><input type="checkbox" id="qh"> 只考曾答錯的</label>
  </div><div style="margin-top:12px"><button class="b pri" id="qs">開始</button></div></div>`;
  $('#qs').onclick=()=>{
    const t=$('#qt').value,l=$('#ql').value,n=+$('#qn').value,hard=$('#qh').checked;
    let pool=V.filter(w=>(l==='all'||w.w[0].toUpperCase()===l)&&(!hard||P(w).wrong>0));
    if(pool.length<4){note('符合條件的單字太少，請放寬條件。');return}
    const words=pick(pool,Math.min(n,pool.length));
    qz={running:true,i:0,right:0,list:words.map(w=>makeQ(w,t)),done:false,answered:false};
    drawQuiz();
  };
}
function stem(s){return s.toLowerCase()}
function makeQ(w,t){
  if(t==='mix')t=['en2zh','zh2en','cloze','spell'][Math.floor(Math.random()*4)];
  const base=clean(w);
  if(t==='cloze'){
    const ex=w.e.find(x=>new RegExp('\\b'+base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,Math.max(3,base.length-2))+'\\w*','i').test(x[0]));
    if(!ex)t='en2zh';else{
      const re=new RegExp('\\b'+base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,Math.max(3,base.length-2))+'\\w*','i');
      const hit=ex[0].match(re)[0];
      return {t,w,prompt:ex[0].replace(re,'_____'),sub:ex[1],answer:hit,type:'spell'};
    }
  }
  const others=shuffle(V.filter(x=>x!==w&&x.d[0][0]===w.d[0][0])).slice(0,3);
  if(others.length<3)others.push(...shuffle(V).slice(0,3-others.length));
  if(t==='en2zh'){const opts=shuffle([w,...others]);return {t,w,prompt:w.w,speak:base,opts:opts.map(o=>defText(o)),answer:defText(w),type:'choice'}}
  if(t==='zh2en'){const opts=shuffle([w,...others]);return {t,w,prompt:defText(w),opts:opts.map(o=>o.w),answer:w.w,type:'choice'}}
  return {t:'spell',w,prompt:defText(w),sub:w.d[0][0],answer:base,type:'spell'};
}
function drawQuiz(){
  const q=qz.list[qz.i];
  if(!q){
    qz.running=false;
    $('#app').innerHTML=`<div class="card"><h2>測驗結束</h2><p style="font-size:28px"><b>${qz.right}</b> / ${qz.list.length}</p>
     <div class="row"><button class="b pri" id="re">再測一次</button><button class="b" data-go="cards">回單字卡</button></div></div>`;
    $('#re').onclick=()=>{qz=null;quiz()};return}
  const head=`<div class="mute small">${qz.i+1} / ${qz.list.length}　答對 ${qz.right}</div><div class="prog"><i style="width:${qz.i/qz.list.length*100}%"></i></div>`;
  let body;
  if(q.type==='choice')body=`<div class="q" style="font-size:22px">${esc(q.prompt)} ${q.speak?'<button class="b small" id="sp">🔊</button>':''}</div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}`;
  else body=`<div class="q" style="font-size:20px">${esc(q.prompt)}</div><div class="mute small" style="margin-bottom:8px">${esc(q.sub||'')}</div><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文"><div style="margin-top:8px"><button class="b pri" id="ok">確定</button></div>`;
  $('#app').innerHTML=`<div class="card">${head}${body}<div id="fb"></div></div>`;
  if($('#sp'))$('#sp').onclick=()=>speak(q.speak);
  qz.answered=false;
  const finish=(ok,given)=>{
    if(qz.answered)return;qz.answered=true;
    const p=P(q.w);p.seen++;if(ok){qz.right++;p.box=Math.min(4,p.box+1)}else{p.wrong++;p.box=0}saveProg();
    $('#fb').innerHTML=`<div class="expl"><span class="tag">${ok?'答對了':'答錯了'}</span>　${esc(q.w.w)}　${q.w.d.map(d=>`<span class="pos">${esc(d[0])}</span>${esc(d[1])}`).join(' ')}<br><span class="small">${esc(q.w.e[0][0])}<br>${esc(q.w.e[0][1])}</span></div>
     <div style="margin-top:10px"><button class="b pri" id="nx">下一題（Enter）</button></div>`;
    $('#nx').onclick=()=>{qz.i++;drawQuiz()};
    if(q.type==='choice'){document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.opts[i]===q.answer)b.classList.add('right');else if(b.dataset.i===String(given))b.classList.add('wrong')})}
  };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(q.opts[+b.dataset.i]===q.answer,b.dataset.i));
  if($('#ok')){
    const submit=()=>finish($('#ans').value.trim().toLowerCase()===q.answer.toLowerCase());
    $('#ok').onclick=submit;$('#ans').focus();
    $('#ans').onkeydown=e=>{if(e.key==='Enter'&&!qz.answered){e.preventDefault();submit()}};
  }
}
document.addEventListener('keydown',e=>{if(tab==='quiz'&&qz&&qz.running&&qz.answered&&e.key==='Enter'&&$('#nx')){e.preventDefault();$('#nx').click()}});

/* ---------- past exams ---------- */
let ex=null;
const qid=(s,n)=>s+'-'+n;
function exam(){
  if(ex&&ex.running)return drawExam();
  $('#app').innerHTML=`<div class="card"><h2>歷屆試題（第四級・非聽力）</h2>
  <p class="small mute">每回含 重組(21–25)、詞彙與結構(26–40)、綜合測驗(41–50)、閱讀測驗(51–60)。聽力與圖片題請至官網。</p>
  <div class="row">
   <label>來源 <select id="es"><option value="mix">隨機混合各屆</option>${E.map(s=>`<option value="${s.session}">第 ${s.session} 屆</option>`).join('')}</select></label>
   <label>範圍 <select id="er">${SECTIONS.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></label>
   <label>模式 <select id="em"><option value="practice">練習（每題立即看解析）</option><option value="test">模擬（交卷後看解析）</option></select></label>
  </div><div style="margin-top:12px"><button class="b pri" id="eg">開始</button></div></div>`;
  $('#eg').onclick=()=>{
    const src=$('#es').value,sec=SECTIONS.find(s=>s[0]===$('#er').value),mode=$('#em').value;
    let items=[];
    if(src==='mix'){
      // random mix: 20 questions from sections in range across sessions
      const pool=[];E.forEach(s=>s.questions.forEach(q=>{if(q.n>=sec[2]&&q.n<=sec[3])pool.push([s,q])}));
      const groups=sec[0]==='clz'||sec[0]==='rd'||sec[0]==='all';
      if(sec[0]==='clz'||sec[0]==='rd'||sec[0]==='all'){
        // keep passages whole: pick random sessions and ranges
        const s=pick(E,1)[0];items=s.questions.filter(q=>q.n>=sec[2]&&q.n<=sec[3]).map(q=>[s,q]);
        if(sec[0]==='all'){items=items}
      }else items=pick(pool,Math.min(20,pool.length));
    }else{
      const s=E.find(x=>x.session==src);items=s.questions.filter(q=>q.n>=sec[2]&&q.n<=sec[3]).map(q=>[s,q]);
    }
    ex={running:true,mode,items,i:0,ans:{},checked:{},title:`${src==='mix'?'隨機混合':'第 '+src+' 屆'}・${sec[1]}`,review:false};
    drawExam();
  };
}
function passageFor(s,n){return s.passages.find(p=>n>=p.from&&n<=p.to)}
function qHTML(s,q,opts){
  const {selected,showAns}=opts;
  const p=passageFor(s,q.n);
  return `<div class="card">
   <div class="mute small">第 ${s.session} 屆・第 ${q.n} 題 ${q.n<=25?'重組':q.n<=40?'詞彙與結構':q.n<=50?'綜合測驗':'閱讀測驗'}</div>
   ${p&&opts.showPassage?`<div class="passage">${esc(p.text)}${p.img?`<img src="${p.img}" alt="題目圖片" style="max-width:100%;display:block;margin-top:8px;border-radius:8px">`:''}</div>`:''}
   <div class="q">${esc(q.stem)||'（請依文章選擇）'}</div>
   ${['A','B','C','D'].map(k=>{
     let cls='opt';
     if(showAns){if(k===q.answer)cls+=' right';else if(k===selected)cls+=' wrong'}else if(k===selected)cls+=' sel';
     return `<button class="${cls}" data-k="${k}" ${showAns?'disabled':''}>(${k}) ${esc(q.choices[k]||'')}</button>`}).join('')}
   ${showAns?`<div class="expl"><span class="tag">${selected===q.answer?'答對':'答案：'+q.answer}</span>　${esc(q.zh)}<br>${esc(q.why)}${p&&p.zh?`<details style="margin-top:6px"><summary class="small">文章中譯</summary><div class="small">${esc(p.zh)}</div></details>`:''}</div>`:''}
  </div>`;
}
function drawExam(){
  const it=ex.items;
  if(ex.review||ex.i>=it.length&&ex.mode==='practice'){return drawResult()}
  if(ex.mode==='practice'){
    const [s,q]=it[ex.i],sel=ex.ans[qid(s.session,q.n)],showAns=!!sel;
    const first=!it[ex.i-1]||passageFor(it[ex.i-1][0],it[ex.i-1][1].n)!==passageFor(s,q.n)||it[ex.i-1][0]!==s;
    $('#app').innerHTML=`<div class="mute small">${esc(ex.title)}　${ex.i+1} / ${it.length}</div><div class="prog"><i style="width:${ex.i/it.length*100}%"></i></div>
      ${qHTML(s,q,{selected:sel,showAns,showPassage:true})}
      <div class="row"><button class="b" id="pv" ${ex.i===0?'disabled':''}>上一題</button><button class="b pri" id="nx" ${showAns?'':'disabled'}>${ex.i===it.length-1?'看結果':'下一題'}</button><button class="b small" id="qt">結束</button></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(sel)return;answer(s,q,b.dataset.k);drawExam()});
    $('#pv').onclick=()=>{ex.i--;drawExam()};$('#nx').onclick=()=>{ex.i++;drawExam()};$('#qt').onclick=()=>ask('結束並查看目前成績？',()=>{ex.review=true;drawExam()});
  }else{
    let html=`<div class="card row" style="justify-content:space-between"><b>${esc(ex.title)}</b><span class="mute small">已作答 ${Object.keys(ex.ans).length} / ${it.length}</span></div>`;
    let lastP=null;
    it.forEach(([s,q])=>{const p=passageFor(s,q.n);html+=qHTML(s,q,{selected:ex.ans[qid(s.session,q.n)],showAns:false,showPassage:p&&p!==lastP});lastP=p});
    html+=`<div class="row"><button class="b pri" id="sub">交卷</button><button class="b" id="qt">放棄</button></div>`;
    $('#app').innerHTML=html;
    let idx=0;
    document.querySelectorAll('.card').forEach(c=>{const m=c.querySelector('.mute.small');});
    const cards=[...document.querySelectorAll('.card')].slice(1);
    cards.forEach((c,i)=>{const [s,q]=it[i];c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ex.ans[qid(s.session,q.n)]=b.dataset.k;c.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));$('.card.row .small').textContent=`已作答 ${Object.keys(ex.ans).length} / ${it.length}`})});
    $('#sub').onclick=()=>{const left=it.length-Object.keys(ex.ans).length;const go=()=>{it.forEach(([s,q])=>record(s,q));ex.review=true;ex.recorded=true;drawExam()};left?ask(`還有 ${left} 題未作答，確定交卷？`,go):go()};
    $('#qt').onclick=()=>ask('放棄這次作答？',()=>{ex=null;exam()});
  }
}
function answer(s,q,k){ex.ans[qid(s.session,q.n)]=k;record(s,q)}
function record(s,q){
  const id=qid(s.session,q.n),k=ex.ans[id];
  if(!k)return;
  if(k===q.answer)delete wrongQ[id];else wrongQ[id]=true;
  saveWrong();
}
function drawResult(){
  const it=ex.items;ex.running=false;
  if(!ex.recorded){it.forEach(([s,q])=>record(s,q))}
  const right=it.filter(([s,q])=>ex.ans[qid(s.session,q.n)]===q.answer).length;
  if(!ex.saved){hist.push({title:ex.title,right,total:it.length,at:Date.now()});saveHist();ex.saved=true}
  let html=`<div class="card"><h2>成績</h2><p style="font-size:28px"><b>${right}</b> / ${it.length}（${Math.round(right/it.length*100)}%）</p>
   <div class="small mute">答錯的題目已加入「錯題本」。未作答的題目視為答錯但不會加入。</div>
   <div class="row" style="margin-top:10px"><button class="b pri" id="nw">再來一組</button><button class="b" data-go="wrong">看錯題本</button></div></div>`;
  let lastP=null;
  it.forEach(([s,q])=>{const p=passageFor(s,q.n);html+=qHTML(s,q,{selected:ex.ans[qid(s.session,q.n)],showAns:true,showPassage:p&&p!==lastP});lastP=p});
  $('#app').innerHTML=html;
  $('#nw').onclick=()=>{ex=null;exam()};
}

/* ---------- wrong book ---------- */
function wrong(){
  const ids=Object.keys(wrongQ);
  const items=ids.map(id=>{const [s,n]=id.split('-').map(Number);const S=E.find(x=>x.session===s);return S&&[S,S.questions.find(q=>q.n===n)]}).filter(Boolean);
  if(!items.length){$('#app').innerHTML='<div class="card"><h2>錯題本</h2><p class="mute">目前沒有錯題。去做歷屆題吧！答錯的題目會自動收進來。</p><button class="b pri" data-go="exam">做歷屆題</button></div>';$('#app').onclick=e=>{if(e.target.dataset.go)go(e.target.dataset.go)};return}
  $('#app').innerHTML=`<div class="card row" style="justify-content:space-between"><b>錯題本 ${items.length} 題</b><button class="b pri" id="rt">重做這些題目</button></div>
   <div class="mute small" style="margin-bottom:8px">以下先顯示答案與解析供複習；按「重做」會變成練習模式，答對的題目會被移出。</div>
   ${items.map(([s,q])=>qHTML(s,q,{selected:null,showAns:true,showPassage:true})).join('')}`;
  $('#rt').onclick=()=>{ex={running:true,mode:'practice',items:shuffle(items),i:0,ans:{},title:'錯題重做',review:false};tab='exam';location.hash='exam';render();drawExam()};
}

/* ---------- guide ---------- */
function guide(){
  const B='https://www.cves.org.tw/';
  $('#app').innerHTML=`
  <div class="card"><h2>第四級題型（依第 31 屆試題）</h2><ul>
   <li><b>Part I 聽力理解（40 分）</b>：看圖辨意 1–10、簡短對話 11–20</li>
   <li><b>Part II 語法與閱讀（80 分）</b>：重組 21–25、詞彙與結構 26–40、綜合測驗 41–50、閱讀測驗 51–60</li>
   <li>共 60 題，答錯不倒扣——不確定也要作答。</li></ul>
   <p class="small mute">以上為歷屆試題卷首的說明；實際報名資訊、成績等級與日期請以學會公告為準。</p></div>
  <div class="card"><h2>官方資源（中華民國商業職業教育學會）</h2><ul>
   <li><a target="_blank" rel="noopener" href="${B}download-eng">題庫・歷屆試題下載頁</a>（含各屆聽力音檔與圖片題）</li>
   <li><a target="_blank" rel="noopener" href="${B}eng-single-word">各級單字</a>（本站單字卡的來源：四級 113 年版）</li>
   <li><a target="_blank" rel="noopener" href="${B}eng-grammar">各級文法</a>（四級文法 PDF）</li>
   <li><a target="_blank" rel="noopener" href="${B}eng-writing">寫作要點</a></li>
   <li><a target="_blank" rel="noopener" href="${B}test-eng">C-EPT 測驗訊息</a></li></ul></div>
  <div class="card"><h2>從歷屆題整理的常考重點</h2><ul>
   <li><b>使役動詞</b>：make / let / have + 人 + 原形動詞；help + 人 + (to) V</li>
   <li><b>動詞形式</b>：have difficulty <i>(in)</i> V-ing；enjoy / finish / keep + V-ing；talk about + V-ing</li>
   <li><b>enough 的位置</b>：形容詞／副詞 + enough（deep enough），名詞前可放 enough</li>
   <li><b>名詞子句</b>：doesn’t know where + 主詞 + 動詞（不倒裝）</li>
   <li><b>被動語態</b>：be + 過去分詞，注意助動詞後接 be done（must be followed）</li>
   <li><b>關係子句</b>：who / which / that 緊接在被修飾的名詞後面</li>
   <li><b>易混動詞</b>：lie–lay–lain、lay–laid–laid、rise / raise、say / tell / speak / talk</li>
   <li><b>可數與不可數</b>：few / many + 可數；little / much + 不可數</li>
   <li><b>連接詞與副詞</b>：However / Therefore / In addition / On the other hand / Even though / As long as</li>
   <li><b>片語動詞</b>：get close to、catch up with、take care of、keep in touch with</li></ul></div>
  <div class="card"><h2>答題技巧</h2><ul>
   <li><b>重組</b>：先找主詞後的動詞或助動詞，再看選項能排除哪些頭尾，最後把完整句子讀一遍。</li>
   <li><b>詞彙</b>：先判斷詞性與空格前後的搭配，再考慮語意。</li>
   <li><b>綜合測驗</b>：先整篇快速讀過，再回頭看連接詞與時態。</li>
   <li><b>閱讀</b>：先看題目再回文章找關鍵字，數字題要自己計算。</li></ul></div>`;
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
render();
